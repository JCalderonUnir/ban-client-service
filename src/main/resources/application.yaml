server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api
spring:
  application:
    name: client-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/client_db}
    username: ${DB_USERNAME:usuario}
    password: ${DB_PASSWORD:contrasena_segura}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: client
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: client
    default-schema: client
    create-schemas: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
