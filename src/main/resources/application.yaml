spring:
  application:
    name: client-service
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: ${URL_KEYCLOAK_OAUTH}
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      open-in-view: false
      properties:
        hibernate:
          default_schema: auth

    flyway:
      enabled: true
      locations: classpath:db/migration
      schemas: auth
      default-schema: auth
      baseline-on-migrate: true
      create-schemas: true

  logging:
    level:
      org.flywaydb: DEBUG
      org.springframework.security: TRACE
      org.springframework.web: DEBUG

kind: Application
